v class="settings-modal-overlay" id="settingsModal" onclick="if(event.target === this) return;">
    <div class="settings-modal-content" onclick="event.stopPropagation()">
        <div class="settings-modal-header">
            <h3 class="settings-modal-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                设置
            </h3>
            <button class="settings-modal-close" onclick="closeSettingsModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="settings-modal-body">
            <div class="settings-form-group">
                <label for="savePathInput">
                    保存文件路径 <span class="required">*</span>
                </label>
                <input type="text" id="savePathInput" placeholder="例如：\\\\ZT-NAS\\公共区-不可编辑\\靓仔测试">
                <span class="hint">必须是 \\ZT-NAS 开头的 NAS 路径，下载时会自动按日期分文件夹（如 \\ZT-NAS\xxx\2026-04-20\）</span>
            </div>
        </div>
        <div class="settings-modal-footer">
            <button class="btn btn-secondary" onclick="closeSettingsModal()">取消</button>
            <button class="btn btn-save-modal" onclick="saveSettings()">保存</button>
        </div>
    </div>
</div>
