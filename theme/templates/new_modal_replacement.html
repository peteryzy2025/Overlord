v class="settings-modal-overlay" id="settingsModal" onclick="if(event.target === this) return;">
    <div class="settings-modal-content" onclick="event.stopPropagation()">
        <div class="settings-modal-header">
            <h3 class="settings-modal-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                设置
            </h3>
            <button class="settings-modal-close" onclick="closeSettingsModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="settings-modal-body">
            <div class="settings-form-group">
                <label>
                    保存文件路径 <span class="required">*</span>
                    <span class="path-count-hint" id="pathCountHint">最多 50 个路径</span>
                </label>
                <div class="path-inputs-container" id="pathInputsContainer">
                    <!-- 动态生成路径输入行 -->
                </div>
                <button class="add-path-btn" id="addPathBtn" onclick="addPathInput()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    添加路径
                </button>
                <span class="hint">必须是 \\ZT-NAS 开头的 NAS 路径（不区分大小写）</span>
            </div>
        </div>
        <div class="settings-modal-footer">
            <button class="btn btn-secondary" onclick="closeSettingsModal()">取消</button>
            <button class="btn btn-save-modal" onclick="saveSettings()">保存</button>
        </div>
    </div>
</div>

<!-- 下载路径选择模态框 -->
<div class="download-modal-overlay" id="downloadModal" onclick="if(event.target === this) return;">
    <div class="download-modal-content" onclick="event.stopPropagation()">
        <div class="download-modal-header">
            <h3 class="download-modal-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                选择下载路径
            </h3>
            <button class="download-modal-close" onclick="closeDownloadModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="download-modal-body">
            <div class="path-select-list" id="pathSelectList">
                <!-- 动态生成路径选项 -->
            </div>
        </div>
        <div class="download-modal-footer">
            <button class="btn btn-secondary" onclick="closeDownloadModal()">取消</button>
            <button class="btn btn-save-modal" onclick="confirmDownload()">开始下载</button>
        </div>
    </div>
</div>
