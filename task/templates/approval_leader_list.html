{% extends 'base/base_task.html' %}
{% load static %}

{% block title %}组长审批 - Divi智管{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/amazon_css.css' %}?v=20260406-approval-leader">
<style>
    .task-list-container {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        width: 100%;
        margin: 0 auto;
        padding: 2rem;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 1.5rem;
    }

    .page-title {
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0;
    }

    .task-card {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: var(--shadow-light);
    }

    .task-table-wrapper {
        overflow-x: auto;
    }

    .task-table {
        width: 100%;
        border-collapse: collapse;
    }

    .task-table th {
        background: var(--bg-secondary);
        padding: 1rem;
        text-align: left;
        font-weight: 600;
        color: var(--text-primary);
        border-bottom: 1px solid var(--border-color);
        white-space: nowrap;
    }

    .task-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-primary);
        vertical-align: middle;
    }

    .task-table tr:last-child td {
        border-bottom: none;
    }

    .task-table tr:hover {
        background: var(--bg-secondary);
    }

    .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
        white-space: nowrap;
    }

    .status-pending {
        background: rgba(59, 130, 246, 0.1);
        color: var(--accent-color);
    }

    .status-approved {
        background: rgba(72, 187, 120, 0.12);
        color: #2f855a;
    }

    .status-rejected {
        background: rgba(229, 62, 62, 0.12);
        color: var(--danger-color);
    }

    .approval-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
    }

    .pagination-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .pagination-info {
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    .pagination-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
    }

    .page-size-select {
        width: 100px;
        height: 38px;
    }

    .detail-row {
        background: var(--bg-secondary);
    }

    .detail-row td {
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    .btn-expand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: var(--bg-primary);
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.75rem;
        color: var(--text-secondary);
    }

    .btn-expand:hover {
        background: var(--bg-secondary);
        color: var(--text-primary);
    }

    .btn-expand.expanded {
        background: var(--bg-secondary);
        color: var(--accent-color);
    }

    .detail-label {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0.15rem 0.5rem;
        background: rgba(59, 130, 246, 0.06);
        border-radius: 4px;
        font-size: 0.75rem;
        color: var(--accent-color);
    }

    .empty-state {
        padding: 2rem 1rem;
        text-align: center;
        color: var(--text-tertiary);
    }

    /* 操作弹框 */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1050;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }
    .modal-overlay.open {
        display: flex;
    }
    .modal-content {
        background: var(--bg-primary);
        border-radius: 12px;
        box-shadow: var(--shadow-heavy, 0 10px 40px rgba(0,0,0,0.15));
        width: 100%;
        max-width: 480px;
        max-height: 90vh;
        overflow-y: auto;
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border-color);
    }
    .modal-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0;
    }
    .modal-close {
        background: none;
        border: none;
        font-size: 1.5rem;
        color: var(--text-secondary);
        cursor: pointer;
        line-height: 1;
    }
    .modal-close:hover {
        color: var(--text-primary);
    }
    .action-modal-body {
        padding: 1.25rem;
    }
    .action-modal-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
        display: block;
    }
    .action-modal-textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 0.9rem;
        resize: vertical;
        min-height: 80px;
        box-sizing: border-box;
    }
    .action-modal-textarea:focus {
        outline: none;
        border-color: var(--accent-color);
    }
    .action-modal-hint {
        font-size: 0.75rem;
        color: var(--text-tertiary);
        margin-top: 0.35rem;
    }
    .action-modal-hint.required {
        color: var(--danger-color);
    }
    .action-modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 0.75rem;
        margin-top: 1.25rem;
    }

    @media (max-width: 768px) {
        .task-list-container {
            padding: 1rem;
        }

        .page-header,
        .pagination-bar {
            flex-direction: column;
            align-items: stretch;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="task-list-container">
    <div class="page-header">
        <h1 class="page-title"><i class="fas fa-user-check"></i> 组长审批</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" type="button" onclick="loadLeaderApprovals()">
                <i class="fas fa-rotate-right"></i> 刷新
            </button>
        </div>
    </div>

    <div class="task-card">
        <div class="task-table-wrapper">
            <table class="task-table">
                <thead>
                    <tr>
                        <th style="width:40px;"></th>
                        <th>审批单号</th>
                        <th>申请者</th>
                        <th>当前状态</th>
                        <th>ASIN</th>
                        <th>店铺名称</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="approvalTableBody">
                    <tr>
                        <td colspan="7" class="empty-state">正在加载审批数据...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="task-card pagination-bar" id="paginationCard" style="display:none;">
        <div class="pagination-info" id="paginationInfo"></div>
        <div class="pagination-actions">
            <label for="pageSizeSelect" class="pagination-info">每页显示</label>
            <select class="form-select page-size-select" id="pageSizeSelect" onchange="changePageSize(this.value)">
                <option value="20">20条</option>
                <option value="50">50条</option>
                <option value="100">100条</option>
            </select>
            <button class="btn btn-secondary" type="button" id="prevPageBtn" onclick="changePage(-1)">上一页</button>
            <button class="btn btn-secondary" type="button" id="nextPageBtn" onclick="changePage(1)">下一页</button>
        </div>
    </div>
</div>

<!-- 审批操作弹框 -->
<div class="modal-overlay" id="actionModal" onclick="if(event.target === this) closeActionModal();">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="actionModalTitle">审批操作</h5>
            <button type="button" class="modal-close" onclick="closeActionModal()">&times;</button>
        </div>
        <div class="action-modal-body">
            <div id="actionModalInfo" style="margin-bottom: 1rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: 8px; font-size: 0.85rem; color: var(--text-secondary);">
                审批单号：<span id="actionApprovalNo" style="color: var(--text-primary); font-weight: 600;"></span>
            </div>
            <label class="action-modal-label" id="actionCommentLabel">审批意见</label>
            <textarea class="action-modal-textarea" id="actionComment" rows="3" placeholder="请输入审批意见..."></textarea>
            <div class="action-modal-hint" id="actionCommentHint">通过时可不填，驳回时必须填写</div>
            <div class="action-modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeActionModal()">取消</button>
                <button type="button" class="btn btn-primary" id="actionConfirmBtn" onclick="confirmAction()">确认</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const leaderApprovalState = {
        rows: [],
        pagination: { page: 1, page_size: 20, total: 0, total_pages: 0, has_next: false, has_prev: false },
        loadingApprovalId: null,
        expandedApprovalIds: new Set(),
    };

    function escapeHtml(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    async function fetchJson(url, options = {}) {
        const response = await fetch(url, options);
        const result = await response.json();

        if (response.status === 403) {
            window.location.href = '/';
            throw new Error(result.message || '无权访问');
        }

        if (!response.ok || !result.success) {
            throw new Error(result.message || '请求失败');
        }

        return result;
    }

    function getStatusClass(statusLabel) {
        if (String(statusLabel).includes('驳回')) return 'status-rejected';
        if (String(statusLabel).includes('通过')) return 'status-approved';
        return 'status-pending';
    }

    function renderTable() {
        const tbody = document.getElementById('approvalTableBody');
        if (!leaderApprovalState.rows.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-inbox"></i><p>当前没有待你审批的审批单</p></td></tr>';
            return;
        }

        let html = '';
        for (const row of leaderApprovalState.rows) {
            const isProcessing = leaderApprovalState.loadingApprovalId === row.approval_id;
            const isExpanded = leaderApprovalState.expandedApprovalIds.has(row.approval_id);
            const hasDetails = row.detail_rows && row.detail_rows.length > 0;

            html += `<tr data-approval-id="${row.approval_id}">
                <td>${hasDetails ? `<button class="btn-expand ${isExpanded ? 'expanded' : ''}" type="button" onclick="toggleDetail(${row.approval_id})"><i class="fas fa-chevron-${isExpanded ? 'down' : 'right'}"></i></button>` : ''}</td>
                <td>${escapeHtml(row.approval_no)}</td>
                <td>${escapeHtml(row.applicant_name)}</td>
                <td><span class="status-badge ${getStatusClass(row.current_status_label)}">${escapeHtml(row.current_status_label)}</span></td>
                <td><span style="color:var(--text-tertiary)">--</span></td>
                <td><span style="color:var(--text-tertiary)">--</span></td>
                <td>
                    <div class="approval-actions">
                        <button class="btn btn-primary" type="button" onclick="handleApprovalAction(${row.approval_id}, 'approved', '${escapeHtml(row.approval_no)}')" ${isProcessing ? 'disabled' : ''}>通过</button>
                        <button class="btn btn-danger" type="button" onclick="handleApprovalAction(${row.approval_id}, 'rejected', '${escapeHtml(row.approval_no)}')" ${isProcessing ? 'disabled' : ''}>驳回</button>
                    </div>
                </td>
            </tr>`;

            if (isExpanded && hasDetails) {
                for (const detail of row.detail_rows) {
                    html += `<tr class="detail-row" data-parent-approval-id="${row.approval_id}">
                        <td></td>
                        <td><span class="detail-label"><i class="fas fa-level-up-alt fa-rotate-90"></i> 详细</span></td>
                        <td></td>
                        <td></td>
                        <td>${escapeHtml(detail.quantity ? `${detail.asin} x ${detail.quantity}` : detail.asin)}</td>
                        <td>${escapeHtml(detail.shop_name)}</td>
                        <td>
                            <div class="approval-actions">
                                <button class="btn btn-primary" type="button" onclick="handleApprovalAction(${row.approval_id}, 'approved', '${escapeHtml(row.approval_no)}')" ${isProcessing ? 'disabled' : ''}>通过</button>
                                <button class="btn btn-danger" type="button" onclick="handleApprovalAction(${row.approval_id}, 'rejected', '${escapeHtml(row.approval_no)}')" ${isProcessing ? 'disabled' : ''}>驳回</button>
                            </div>
                        </td>
                    </tr>`;
                }
            }
        }

        tbody.innerHTML = html;
    }

    function toggleDetail(approvalId) {
        if (leaderApprovalState.expandedApprovalIds.has(approvalId)) {
            leaderApprovalState.expandedApprovalIds.delete(approvalId);
        } else {
            leaderApprovalState.expandedApprovalIds.add(approvalId);
        }
        renderTable();
    }

    function renderPagination() {
        const pagination = leaderApprovalState.pagination || {};
        const card = document.getElementById('paginationCard');
        document.getElementById('pageSizeSelect').value = String(pagination.page_size || 20);
        document.getElementById('paginationInfo').textContent = `共 ${pagination.total || 0} 个审批单，当前第 ${pagination.page || 1}/${pagination.total_pages || 1} 页`;
        document.getElementById('prevPageBtn').disabled = !pagination.has_prev;
        document.getElementById('nextPageBtn').disabled = !pagination.has_next;
        card.style.display = pagination.total ? 'flex' : 'none';
    }

    async function loadLeaderApprovals(page = leaderApprovalState.pagination.page || 1) {
        try {
            const params = new URLSearchParams({
                page: String(page),
                page_size: String(leaderApprovalState.pagination.page_size || 20)
            });
            const result = await fetchJson(`/api/task/approvals/leader/list/?${params.toString()}`);
            leaderApprovalState.rows = result.data || [];
            leaderApprovalState.pagination = result.pagination || leaderApprovalState.pagination;
            renderTable();
            renderPagination();
        } catch (error) {
            document.getElementById('approvalTableBody').innerHTML = `<tr><td colspan="7" class="empty-state">${escapeHtml(error.message)}</td></tr>`;
            document.getElementById('paginationCard').style.display = 'none';
            if (typeof showNotification === 'function') showNotification('加载审批列表失败: ' + error.message, 'error');
        }
    }

    function changePage(offset) {
        const nextPage = (leaderApprovalState.pagination.page || 1) + offset;
        if (nextPage < 1) return;
        loadLeaderApprovals(nextPage);
    }

    function changePageSize(value) {
        leaderApprovalState.pagination.page_size = Number(value) || 20;
        loadLeaderApprovals(1);
    }

    let actionModalState = { approvalId: null, action: null, approvalNo: '' };

    function handleApprovalAction(approvalId, action, approvalNo) {
        actionModalState = { approvalId, action, approvalNo: approvalNo || '' };
        const isApprove = action === 'approved';
        document.getElementById('actionModalTitle').textContent = isApprove ? '通过审批' : '驳回审批';
        document.getElementById('actionApprovalNo').textContent = actionModalState.approvalNo;
        document.getElementById('actionCommentLabel').textContent = isApprove ? '通过意见（选填）' : '驳回原因（必填）';
        document.getElementById('actionComment').value = '';
        const hint = document.getElementById('actionCommentHint');
        hint.textContent = isApprove ? '通过时可不填，如有补充意见可在此填写' : '请填写驳回原因，以便申请人了解并修改';
        hint.className = isApprove ? 'action-modal-hint' : 'action-modal-hint required';
        const btn = document.getElementById('actionConfirmBtn');
        btn.textContent = isApprove ? '确认通过' : '确认驳回';
        btn.className = isApprove ? 'btn btn-primary' : 'btn btn-danger';
        document.getElementById('actionModal').classList.add('open');
    }

    function closeActionModal() {
        document.getElementById('actionModal').classList.remove('open');
        actionModalState = { approvalId: null, action: null, approvalNo: '' };
    }

    async function confirmAction() {
        const { approvalId, action } = actionModalState;
        if (!approvalId || !action) return;
        const comment = document.getElementById('actionComment').value.trim();
        if (action === 'rejected' && !comment) {
            if (typeof showNotification === 'function') showNotification('请填写驳回原因', 'error');
            document.getElementById('actionComment').focus();
            return;
        }
        const actionLabel = action === 'approved' ? '通过' : '驳回';
        closeActionModal();

        leaderApprovalState.loadingApprovalId = approvalId;
        renderTable();

        try {
            const result = await fetchJson('/api/task/approvals/leader/action/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''
                },
                body: JSON.stringify({
                    approval_id: approvalId,
                    action: action,
                    comment: comment
                })
            });
            if (typeof showNotification === 'function') showNotification(result.message || `审批已${actionLabel}`, 'success');
            await loadLeaderApprovals(leaderApprovalState.pagination.page || 1);
        } catch (error) {
            if (typeof showNotification === 'function') showNotification(`审批${actionLabel}失败: ` + error.message, 'error');
        } finally {
            leaderApprovalState.loadingApprovalId = null;
            renderTable();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadLeaderApprovals();
    });
</script>
{% endblock %}
