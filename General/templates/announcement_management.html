{% extends 'base_z.html' %}
{% load static %}

{% block title %}公告管理 - Overlord{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/amazon_css.css' %}">
    <style>
        :root {
            --accent-color: #667eea;
            --accent-hover: #5a67d8;
        }

        /* 模态框样式复用自 amazon_shop_management.html */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--bg-primary);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-heavy);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
            z-index: 11;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
        }

        .modal-close:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 1rem;
        }

        .modal-footer {
            position: sticky;
            bottom: 0;
            background-color: var(--bg-primary);
            z-index: 11;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-cancel-modal {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-save-modal {
            background-color: #22c55e;
            color: white;
        }

        .btn-save-modal:hover {
            background-color: #16a34a;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .form-group label {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 0.75rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .status-active {
            background-color: #C6F6D5;
            color: #22543D;
        }

        .status-inactive {
            background-color: #FED7D7;
            color: #742A2A;
        }

        .priority-high {
            background-color: #FED7D7;
            color: #C53030;
        }

        .priority-medium {
            background-color: #FEF3C7;
            color: #92400E;
        }

        .priority-low {
            background-color: #BEE3F8;
            color: #2B6CB0;
        }

        .btn-create {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.3s;
        }

        .btn-create:hover {
            background-color: #16a34a;
        }

        .btn-action {
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background-color: var(--bg-secondary);
            color: var(--accent-color);
        }

        .btn-action.delete:hover {
            color: #e53e3e;
            border-color: #e53e3e;
        }
    </style>
{% endblock %}

{% block page_content %}
<div class="performance-main">
    <div class="page-header">
        <div>
            <h1 class="page-title">公告管理</h1>
            <p class="page-subtitle">发布和管理系统公告，通知所有用户重要信息</p>
        </div>
        <div>
            <button class="btn-create" onclick="openCreateModal()">
                <i class="fas fa-plus"></i>新建公告
            </button>
        </div>
    </div>

    <!-- 数据表格 -->
    <div class="data-section">
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>优先级</th>
                        <th>状态</th>
                        <th>生效时间</th>
                        <th>过期时间</th>
                        <th>创建人</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="announcementTableBody">
                    <!-- 数据将通过JS加载 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 创建/编辑公告模态框 -->
<div class="modal-overlay" id="announcementModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">新建公告</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="announcementId">
            <div class="form-group">
                <label for="title">标题 <span style="color:red;">*</span></label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label for="content">内容</label>
                <textarea id="content" rows="5"></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="priority">优先级</label>
                    <select id="priority">
                        <option value="low">低优先级</option>
                        <option value="medium" selected>中优先级</option>
                        <option value="high">高优先级</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <div style="display: flex; align-items: center; height: 42px;">
                         <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="isActive" checked style="width: auto;">
                            <span>启用</span>
                        </label>
                    </div>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="validFrom">生效时间</label>
                    <input type="datetime-local" id="validFrom">
                </div>
                <div class="form-group">
                    <label for="validTo">过期时间</label>
                    <input type="datetime-local" id="validTo">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem;">
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="isDismissible" checked style="width: auto;">
                        <span>允许关闭</span>
                    </label>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="canMarkRead" checked style="width: auto;">
                        <span>允许标记已读</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary btn-cancel-modal" onclick="closeModal()">取消</button>
            <button class="btn btn-save-modal" onclick="saveAnnouncement()">保存</button>
        </div>
    </div>
</div>

<!-- 已读记录模态框 -->
<div class="modal-overlay" id="readRecordsModal">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h2 class="modal-title">已读记录</h2>
            <button class="modal-close" onclick="closeReadRecordsModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="table-container" style="box-shadow: none; border: none;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>用户</th>
                            <th>部门</th>
                            <th>已读时间</th>
                        </tr>
                    </thead>
                    <tbody id="readRecordsTableBody">
                        <!-- 数据将通过JS加载 -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary btn-cancel-modal" onclick="closeReadRecordsModal()">关闭</button>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadAnnouncements();
    });

    function loadAnnouncements() {
        fetch('{% url "general:get_announcements_api" %}')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    renderTable(data.data);
                } else {
                    alert('加载公告失败: ' + data.error);
                }
            })
            .catch(error => console.error('Error:', error));
    }

    function renderTable(announcements) {
        const tbody = document.getElementById('announcementTableBody');
        tbody.innerHTML = '';

        if (announcements.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="empty-state" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                        <i class="fas fa-inbox" style="font-size: 2rem; margin-bottom: 0.5rem; display: block;"></i>
                        暂无公告数据
                    </td>
                </tr>
            `;
            return;
        }

        announcements.forEach(ann => {
            const tr = document.createElement('tr');
            tr.ondblclick = () => showReadRecords(ann.id);
            tr.title = "双击查看已读记录";
            tr.style.cursor = "pointer";
            tr.innerHTML = `
                <td>${ann.title}</td>
                <td><span class="status-badge priority-${ann.priority}">${ann.priority_display}</span></td>
                <td>
                    <span class="status-badge ${ann.is_active ? 'status-active' : 'status-inactive'}">
                        ${ann.is_active ? '启用' : '禁用'}
                    </span>
                </td>
                <td>${ann.valid_from}</td>
                <td>${ann.valid_to}</td>
                <td>${ann.created_by}</td>
                <td>${ann.created_at}</td>
                <td>
                    <button class="btn-action" onclick='editAnnouncement(${JSON.stringify(ann).replace(/'/g, "&#39;")})' title="编辑">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn-action delete" onclick="deleteAnnouncement(${ann.id})" title="删除">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function openCreateModal() {
        document.getElementById('modalTitle').textContent = '新建公告';
        document.getElementById('announcementId').value = '';
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        document.getElementById('priority').value = 'medium';
        document.getElementById('isActive').checked = true;
        document.getElementById('isDismissible').checked = true;
        document.getElementById('canMarkRead').checked = true;
        
        // 设置默认时间
        const now = new Date();
        const nextWeek = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
        
        document.getElementById('validFrom').value = formatDateTimeLocal(now);
        document.getElementById('validTo').value = formatDateTimeLocal(nextWeek);
        
        document.getElementById('announcementModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('announcementModal').style.display = 'none';
    }

    function closeReadRecordsModal() {
        document.getElementById('readRecordsModal').style.display = 'none';
    }

    // 点击遮罩关闭
    document.getElementById('announcementModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });

    document.getElementById('readRecordsModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeReadRecordsModal();
        }
    });

    // ESC 关闭
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeModal();
            closeReadRecordsModal();
        }
    });

    function editAnnouncement(ann) {
        document.getElementById('modalTitle').textContent = '编辑公告';
        document.getElementById('announcementId').value = ann.id;
        document.getElementById('title').value = ann.title;
        document.getElementById('content').value = ann.content;
        document.getElementById('priority').value = ann.priority;
        document.getElementById('isActive').checked = ann.is_active;
        document.getElementById('isDismissible').checked = ann.is_dismissible;
        document.getElementById('canMarkRead').checked = ann.can_mark_read;
        
        document.getElementById('validFrom').value = ann.valid_from.replace(' ', 'T');
        document.getElementById('validTo').value = ann.valid_to.replace(' ', 'T');
        
        document.getElementById('announcementModal').style.display = 'block';
    }
    
    function formatDateTimeLocal(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function saveAnnouncement() {
        const id = document.getElementById('announcementId').value;
        const isEdit = !!id;
        const url = isEdit 
            ? `{% url "general:update_announcement_api" 0 %}`.replace('0', id)
            : `{% url "general:create_announcement_api" %}`;
            
        const data = {
            title: document.getElementById('title').value,
            content: document.getElementById('content').value,
            priority: document.getElementById('priority').value,
            is_active: document.getElementById('isActive').checked,
            is_dismissible: document.getElementById('isDismissible').checked,
            can_mark_read: document.getElementById('canMarkRead').checked,
            valid_from: document.getElementById('validFrom').value,
            valid_to: document.getElementById('validTo').value
        };
        
        if (!data.title) {
            alert('请输入标题');
            return;
        }

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                closeModal();
                loadAnnouncements();
            } else {
                alert('保存失败: ' + result.error);
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function deleteAnnouncement(id) {
        if (!confirm('确定要删除这条公告吗？')) return;

        fetch(`{% url "general:delete_announcement_api" 0 %}`.replace('0', id), {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            }
        })
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                loadAnnouncements();
            } else {
                alert('删除失败: ' + result.error);
            }
        })
        .catch(error => console.error('Error:', error));
    }
    
    function showReadRecords(announcementId) {
        const tbody = document.getElementById('readRecordsTableBody');
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">加载中...</td></tr>`;
        document.getElementById('readRecordsModal').style.display = 'block';

        fetch(`{% url "general:get_announcement_read_records_api" 0 %}`.replace('0', announcementId))
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    if (result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--text-secondary);">暂无已读记录</td></tr>`;
                        return;
                    }
                    
                    tbody.innerHTML = result.data.map(record => `
                        <tr>
                            <td>${record.user_name}</td>
                            <td>${record.department}</td>
                            <td>${record.read_at}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: red;">加载失败: ${result.error}</td></tr>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: red;">系统错误</td></tr>`;
            });
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
