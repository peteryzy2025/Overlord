{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divi智管 - 登录 V2</title>
    <link rel="icon" href="{% static 'img/ico/favicon.ico' %}" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --ink: #20232a;
            --muted: #6b7280;
            --line: #d9dde5;
            --panel: #f5f7fb;
            --surface: #ffffff;
            --danger: #d92d20;
            --accent: #3f51b5;
            --accent-dark: #26327f;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ink);
            background: var(--surface);
        }

        button,
        input {
            font: inherit;
        }

        .login-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }

        .stage-panel {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 44px 52px 36px;
            overflow: hidden;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
                linear-gradient(135deg, #f4f6f8 0%, #d5dbe3 100%);
            background-size: 28px 28px, 28px 28px, auto;
        }

        .brand {
            position: relative;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #22252d;
        }

        .brand img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.55);
            padding: 4px;
        }

        .stage-copy {
            position: relative;
            z-index: 3;
            max-width: 520px;
            color: #2b2f38;
        }

        .stage-copy h2 {
            margin: 0 0 12px;
            font-size: clamp(32px, 4vw, 52px);
            line-height: 1.08;
            letter-spacing: 0;
        }

        .stage-copy p {
            margin: 0;
            font-size: 15px;
            line-height: 1.8;
            color: #59606d;
        }

        .stage-links {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 32px;
            color: #59606d;
            font-size: 14px;
        }

        .stage-links a {
            color: inherit;
            text-decoration: none;
            transition: color 160ms ease;
        }

        .stage-links a:hover {
            color: #1f232b;
        }

        .stage-floor {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.36) 100%);
            pointer-events: none;
        }

        .characters-wrap {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 430px;
        }

        .characters {
            position: relative;
            width: min(550px, 86%);
            height: 420px;
        }

        .character {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            transition: height 700ms ease, transform 700ms ease;
            will-change: transform, height;
        }

        .face {
            position: absolute;
            display: flex;
            transition: left 700ms ease, top 700ms ease, transform 200ms ease;
            transform: translate(var(--face-x, 0px), var(--face-y, 0px));
        }

        .eye-ball {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--eye-size, 18px);
            height: var(--eye-size, 18px);
            overflow: hidden;
            border-radius: 999px;
            background: #ffffff;
            transition: height 150ms ease;
        }

        .pupil {
            width: var(--pupil-size, 7px);
            height: var(--pupil-size, 7px);
            border-radius: 999px;
            background: #2d2d2d;
            transition: transform 100ms ease-out, opacity 100ms ease;
        }

        .eye-ball.is-blinking {
            height: 2px;
        }

        .eye-ball.is-blinking .pupil {
            opacity: 0;
        }

        .char-purple {
            left: 13%;
            z-index: 1;
            width: 33%;
            height: 400px;
            border-radius: 8px 8px 0 0;
            background: #6c3ff5;
            transform: skewX(var(--body-skew, 0deg));
        }

        .char-purple .face {
            left: 25%;
            top: 40px;
            gap: 32px;
        }

        .char-black {
            left: 43%;
            z-index: 2;
            width: 22%;
            height: 310px;
            border-radius: 8px 8px 0 0;
            background: #2d2d2d;
            transform: skewX(var(--body-skew, 0deg));
        }

        .char-black .face {
            left: 21%;
            top: 32px;
            gap: 24px;
        }

        .char-black .eye-ball {
            --eye-size: 16px;
            --pupil-size: 6px;
        }

        .char-orange {
            left: 0;
            z-index: 3;
            width: 44%;
            height: 200px;
            border-radius: 120px 120px 0 0;
            background: #ff9b6b;
            transform: skewX(var(--body-skew, 0deg));
        }

        .char-orange .face {
            left: 34%;
            top: 90px;
            gap: 32px;
        }

        .char-orange .pupil,
        .char-yellow .pupil {
            --pupil-size: 12px;
        }

        .char-yellow {
            left: 56%;
            z-index: 4;
            width: 25%;
            height: 230px;
            border-radius: 70px 70px 0 0;
            background: #e8d754;
            transform: skewX(var(--body-skew, 0deg));
        }

        .char-yellow .face {
            left: 37%;
            top: 40px;
            gap: 24px;
        }

        .mouth {
            position: absolute;
            left: 29%;
            top: 88px;
            width: 58%;
            height: 4px;
            border-radius: 999px;
            background: #2d2d2d;
            transition: transform 200ms ease, left 700ms ease, top 700ms ease;
            transform: translate(var(--face-x, 0px), var(--face-y, 0px));
        }

        .characters.is-typing .char-purple,
        .characters.password-hidden .char-purple {
            height: 440px;
            transform: skewX(calc(var(--body-skew, 0deg) - 12deg)) translateX(40px);
        }

        .characters.is-typing .char-black,
        .characters.password-hidden .char-black {
            transform: skewX(var(--body-skew, 0deg));
        }

        .characters.is-looking .char-purple .face {
            left: 31%;
            top: 65px;
        }

        .characters.is-looking .char-black {
            transform: skewX(calc(var(--body-skew, 0deg) + 10deg)) translateX(20px);
        }

        .characters.is-looking .char-black .face {
            left: 27%;
            top: 12px;
        }

        .characters.password-visible .character {
            transform: skewX(0deg);
        }

        .characters.password-visible .char-purple .face {
            left: 11%;
            top: 35px;
        }

        .characters.password-visible .char-black .face {
            left: 8%;
            top: 28px;
        }

        .characters.password-visible .char-orange .face {
            left: 21%;
            top: 85px;
        }

        .characters.password-visible .char-yellow .face {
            left: 14%;
            top: 35px;
        }

        .characters.password-visible .char-yellow .mouth {
            left: 7%;
        }

        .form-panel {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
            background: #ffffff;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
        }

        .mobile-brand {
            display: none;
            justify-content: center;
            margin-bottom: 42px;
        }

        .login-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .login-header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0;
        }

        .login-header p {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
        }

        .login-form {
            display: grid;
            gap: 20px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field label {
            font-size: 14px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 48px;
            border: 1px solid rgba(217, 221, 229, 0.86);
            border-radius: 6px;
            padding: 0 14px;
            color: var(--ink);
            background: #ffffff;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(63, 81, 181, 0.12);
            background: #fbfcff;
        }

        .password-input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 8px;
            color: #737c8b;
            background: transparent;
            cursor: pointer;
            transform: translateY(-50%);
            transition: color 160ms ease, background 160ms ease;
        }

        .toggle-password:hover {
            color: var(--ink);
            background: #f0f2f6;
        }

        .field-error {
            display: none;
            font-size: 13px;
            color: var(--danger);
        }

        .alert {
            display: none;
            border: 1px solid rgba(217, 45, 32, 0.24);
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--danger);
            background: rgba(217, 45, 32, 0.08);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .remember-option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #272b35;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .remember-option input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .text-link {
            border: 0;
            padding: 0;
            color: var(--accent);
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .text-link:hover {
            text-decoration: underline;
        }

        .login-button {
            position: relative;
            width: 100%;
            height: 48px;
            margin-top: 4px;
            overflow: hidden;
            border: 1px solid rgba(217, 221, 229, 0.86);
            border-radius: 999px;
            color: var(--ink);
            background: #ffffff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 180ms ease, color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
        }

        .login-button:hover {
            border-color: var(--accent-dark);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(38, 50, 127, 0.18);
        }

        .login-button:disabled {
            cursor: not-allowed;
            opacity: 0.76;
            transform: none;
            box-shadow: none;
        }

        .button-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 300ms ease, opacity 300ms ease;
        }

        .button-hover {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            color: #ffffff;
            background: var(--accent);
            transform: translateY(0);
            transition: opacity 300ms ease;
        }

        .login-button:hover .button-label {
            opacity: 0;
            transform: translateX(48px);
        }

        .login-button:hover .button-hover {
            opacity: 1;
        }

        .social-login {
            margin-top: 24px;
        }

        .signup-line {
            margin-top: 32px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(63, 81, 181, 0.25);
            border-top-color: var(--accent);
            border-radius: 999px;
            animation: spin 850ms linear infinite;
        }

        .login-button.is-loading .spinner {
            display: inline-block;
        }

        .login-button.is-loading .arrow-icon,
        .login-button.is-loading .button-hover {
            display: none;
        }

        .shake {
            animation: shake 420ms ease;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
                background: #ffffff;
            }

            .login-shell {
                display: block;
            }

            .stage-panel {
                display: none;
            }

            .form-panel {
                min-height: 100vh;
                padding: 34px 22px;
            }

            .mobile-brand {
                display: flex;
            }
        }

        @media (max-width: 460px) {
            .form-panel {
                padding: 28px 18px;
            }

            .login-header h1 {
                font-size: 28px;
            }

            .login-box {
                max-width: 100%;
            }

            .form-options {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<main class="login-shell">
    <section class="stage-panel" aria-hidden="true">
        <div class="brand">
            <img src="{% static 'img/y/logo.png' %}" alt="">
            <span>Divi智管</span>
        </div>

        <div class="characters-wrap">
            <div class="characters" id="characters">
                <div class="character char-purple" data-character>
                    <div class="face">
                        <div class="eye-ball" data-blink="purple"><span class="pupil" data-max="5"></span></div>
                        <div class="eye-ball" data-blink="purple"><span class="pupil" data-max="5"></span></div>
                    </div>
                </div>

                <div class="character char-black" data-character>
                    <div class="face">
                        <div class="eye-ball" data-blink="black"><span class="pupil" data-max="4"></span></div>
                        <div class="eye-ball" data-blink="black"><span class="pupil" data-max="4"></span></div>
                    </div>
                </div>

                <div class="character char-orange" data-character>
                    <div class="face">
                        <span class="pupil" data-max="5"></span>
                        <span class="pupil" data-max="5"></span>
                    </div>
                </div>

                <div class="character char-yellow" data-character>
                    <div class="face">
                        <span class="pupil" data-max="5"></span>
                        <span class="pupil" data-max="5"></span>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>

        <div class="stage-links">
            <a href="javascript:void(0)">隐私政策</a>
            <a href="javascript:void(0)">服务条款</a>
        </div>
        <div class="stage-floor"></div>
    </section>

    <section class="form-panel">
        <div class="login-box" id="loginBox">
            <div class="mobile-brand brand">
                <img src="{% static 'img/y/logo.png' %}" alt="Divi智管">
                <span>Divi智管</span>
            </div>

            <header class="login-header">
                <h1>欢迎回来</h1>
                <p>请输入账号密码进入 Divi智管</p>
            </header>

            <form class="login-form" id="loginForm" novalidate>
                {% csrf_token %}

                <div class="alert" id="errorAlert" role="alert"></div>

                <div class="field">
                    <label for="username">用户名</label>
                    <div class="input-wrap">
                        <input class="form-input" id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required>
                    </div>
                    <span class="field-error" id="usernameError">请输入用户名</span>
                </div>

                <div class="field">
                    <label for="password">密码</label>
                    <div class="input-wrap">
                        <input class="form-input password-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
                        <button class="toggle-password" id="togglePassword" type="button" title="显示密码" aria-label="显示密码">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="passwordError">请输入密码</span>
                </div>

                <div class="form-options">
                    <label class="remember-option" for="remember">
                        <input id="remember" name="remember" type="checkbox">
                        <span>记住 30 天</span>
                    </label>
                    <button class="text-link support-action" type="button">忘记密码？</button>
                </div>

                <button class="login-button" id="loginBtn" type="submit">
                    <span class="button-label" id="btnText">
                        <span>登录</span>
                        <span class="spinner" id="loadingSpinner"></span>
                    </span>
                    <span class="button-hover">
                        <span>登录</span>
                        <svg class="arrow-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
                            <path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="m13 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </button>
            </form>

            <div class="social-login">
                <button class="login-button support-action" type="button">
                    <span class="button-label">
                        <svg viewBox="0 0 488 512" width="18" height="18" aria-hidden="true">
                            <path fill="currentColor" d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 126 23.4 172.9 61.9l-76.2 76.2C322.3 113.2 289.4 96 248 96c-88.8 0-160.1 71.9-160.1 160.1s71.3 160.1 160.1 160.1c98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 26.9 3.9 41.4z"></path>
                        </svg>
                        <span>使用 Google 登录</span>
                    </span>
                    <span class="button-hover">
                        <span>使用 Google 登录</span>
                        <svg viewBox="0 0 488 512" width="18" height="18" aria-hidden="true">
                            <path fill="currentColor" d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 126 23.4 172.9 61.9l-76.2 76.2C322.3 113.2 289.4 96 248 96c-88.8 0-160.1 71.9-160.1 160.1s71.3 160.1 160.1 160.1c98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 26.9 3.9 41.4z"></path>
                        </svg>
                    </span>
                </button>
            </div>

            <div class="signup-line">
                还没有账号？
                <button class="text-link support-action" type="button">注册</button>
            </div>
        </div>
    </section>
</main>

<script>
    const characters = document.getElementById('characters');
    const characterNodes = document.querySelectorAll('[data-character]');
    const pupils = document.querySelectorAll('.pupil');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const form = document.getElementById('loginForm');
    const loginBox = document.getElementById('loginBox');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const errorAlert = document.getElementById('errorAlert');
    const supportActions = document.querySelectorAll('.support-action');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let isPeeking = false;
    let peekTimer = null;
    let redirecting = false;

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function setEyeIcon(visible) {
        eyeIcon.innerHTML = visible
            ? '<path d="m3 3 18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.1 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6.1 6.1C3.4 7.9 2 12 2 12a17.4 17.4 0 0 0 7.9 6.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
            : '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>';
    }

    function updateCharacterPosture() {
        if (!characters) return;

        const activeElement = document.activeElement;
        const isTyping = activeElement === usernameInput || activeElement === passwordInput;
        const hasPassword = passwordInput.value.length > 0;
        const passwordVisible = passwordInput.type === 'text';

        characters.classList.toggle('is-typing', isTyping);
        characters.classList.toggle('password-hidden', hasPassword && !passwordVisible);
        characters.classList.toggle('password-visible', hasPassword && passwordVisible);

        if (hasPassword && passwordVisible && !peekTimer) {
            schedulePeek();
        }
        if (!(hasPassword && passwordVisible)) {
            clearTimeout(peekTimer);
            peekTimer = null;
            isPeeking = false;
            characters.classList.remove('is-peeking');
        }
    }

    function schedulePeek() {
        peekTimer = setTimeout(() => {
            if (!characters.classList.contains('password-visible')) {
                peekTimer = null;
                return;
            }
            isPeeking = true;
            characters.classList.add('is-peeking');
            setTimeout(() => {
                isPeeking = false;
                characters.classList.remove('is-peeking');
                peekTimer = null;
                if (characters.classList.contains('password-visible')) {
                    schedulePeek();
                }
            }, 800);
        }, Math.random() * 2400 + 1600);
    }

    function animateLookAtEachOther() {
        if (!characters) return;
        characters.classList.add('is-looking');
        window.setTimeout(() => characters.classList.remove('is-looking'), 800);
    }

    function updateFaceVars() {
        characterNodes.forEach((character) => {
            const rect = character.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 3;
            const deltaX = mouseX - centerX;
            const deltaY = mouseY - centerY;
            const faceX = clamp(deltaX / 20, -15, 15);
            const faceY = clamp(deltaY / 30, -10, 10);
            const skew = clamp(-deltaX / 120, -6, 6);

            character.style.setProperty('--face-x', `${faceX}px`);
            character.style.setProperty('--face-y', `${faceY}px`);
            character.style.setProperty('--body-skew', `${skew}deg`);
        });
    }

    function forcedPupilPosition(pupil) {
        if (!characters) return null;

        const isPurple = pupil.closest('.char-purple');
        const isBlack = pupil.closest('.char-black');

        if (characters.classList.contains('password-visible')) {
            if (isPurple) {
                return isPeeking ? { x: 4, y: 5 } : { x: -4, y: -4 };
            }
            if (isBlack) {
                return { x: -4, y: -4 };
            }
            return { x: -5, y: -4 };
        }

        if (characters.classList.contains('is-looking')) {
            if (isPurple) return { x: 3, y: 4 };
            if (isBlack) return { x: 0, y: -4 };
        }

        return null;
    }

    function updatePupils() {
        pupils.forEach((pupil) => {
            const forced = forcedPupilPosition(pupil);
            if (forced) {
                pupil.style.transform = `translate(${forced.x}px, ${forced.y}px)`;
                return;
            }

            const rect = pupil.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const deltaX = mouseX - centerX;
            const deltaY = mouseY - centerY;
            const maxDistance = Number(pupil.dataset.max || 5);
            const distance = Math.min(Math.hypot(deltaX, deltaY), maxDistance);
            const angle = Math.atan2(deltaY, deltaX);
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;

            pupil.style.transform = `translate(${x}px, ${y}px)`;
        });
    }

    function blink(group) {
        document.querySelectorAll(`[data-blink="${group}"]`).forEach((eye) => {
            eye.classList.add('is-blinking');
            setTimeout(() => eye.classList.remove('is-blinking'), 150);
        });
    }

    function scheduleBlink(group) {
        setTimeout(() => {
            blink(group);
            scheduleBlink(group);
        }, Math.random() * 4000 + 3000);
    }

    function renderCharacters() {
        updateCharacterPosture();
        updateFaceVars();
        updatePupils();
        requestAnimationFrame(renderCharacters);
    }

    window.addEventListener('mousemove', (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
    });

    [usernameInput, passwordInput].forEach((input) => {
        input.addEventListener('focus', animateLookAtEachOther);
        input.addEventListener('input', updateCharacterPosture);
        input.addEventListener('blur', updateCharacterPosture);
    });

    togglePassword.addEventListener('click', () => {
        const visible = passwordInput.type === 'password';
        passwordInput.type = visible ? 'text' : 'password';
        togglePassword.title = visible ? '隐藏密码' : '显示密码';
        togglePassword.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
        setEyeIcon(visible);
        passwordInput.focus();
        updateCharacterPosture();
    });

    supportActions.forEach((button) => {
        button.addEventListener('click', () => {
            showError('该功能暂未接入，请使用用户名密码登录');
        });
    });

    function showFieldError(id, visible) {
        const element = document.getElementById(id);
        if (element) {
            element.style.display = visible ? 'block' : 'none';
        }
    }

    function showError(message) {
        errorAlert.textContent = message;
        errorAlert.style.display = 'block';
        loginBox.classList.remove('shake');
        void loginBox.offsetWidth;
        loginBox.classList.add('shake');
    }

    function setLoading(loading) {
        loginBtn.disabled = loading;
        loginBtn.classList.toggle('is-loading', loading);
        btnText.querySelector('span:first-child').textContent = loading ? '登录中...' : '登录';
        loadingSpinner.style.display = loading ? 'inline-block' : 'none';
    }

    form.addEventListener('submit', (event) => {
        event.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');

        errorAlert.style.display = 'none';
        showFieldError('usernameError', !username);
        showFieldError('passwordError', !password);

        if (!username || !password) {
            showError('请先填写用户名和密码');
            return;
        }

        if (!csrfToken) {
            showError('页面信息不完整，请刷新后重试');
            return;
        }

        setLoading(true);

        fetch('/login-v2/', {
            method: 'POST',
            credentials: 'include',
            headers: {
                'X-CSRFToken': csrfToken.value,
                'X-Requested-With': 'XMLHttpRequest',
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({
                username,
                password
            })
        })
            .then((response) => response.json())
            .then((data) => {
                if (data.success) {
                    redirecting = true;
                    document.body.style.transition = 'opacity 220ms ease';
                    document.body.style.opacity = '0';
                    window.setTimeout(() => {
                        window.location.href = data.redirect_url || '/main/';
                    }, 220);
                    return;
                }

                showError(data.message || '用户名或密码错误');
            })
            .catch(() => {
                showError('网络异常，请稍后重试');
            })
            .finally(() => {
                if (!redirecting) {
                    setLoading(false);
                }
            });
    });

    scheduleBlink('purple');
    scheduleBlink('black');
    renderCharacters();
</script>
</body>
</html>
