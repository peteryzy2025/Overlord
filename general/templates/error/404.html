{% extends 'base/base.html' %}
{% load static %}
{% block title %}404 - 页面未找到{% endblock %}
{% block main_container %}
<div class="error-container">
    <div class="error-card">
        <div class="error-icon"><i class="fas fa-search"></i></div>
        <div class="error-code">404</div>
        <h2 class="error-message">页面走丢了</h2>
        <p class="error-description">您访问的页面不存在或已被移动。</p>
        <div class="error-actions">
            <a href="javascript:history.back()" class="btn-error btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
            <a href="{% url 'main' %}" class="btn-error btn-primary">
                <i class="fas fa-home"></i> 首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
